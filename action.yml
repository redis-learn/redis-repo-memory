name: 'Redis Repo Memory'
description: 'Give your repository a memory — surfaces related PRs, issues, and commits using Redis vector search.'

branding:
  icon: 'database'
  color: 'red'

inputs:
  redis-url:
    description: >
      Redis connection URL for the memory store.
      e.g. redis://default:<password>@<host>:<port>
      A Redis Cloud free-tier database works fine — https://redis.io/try-free/
    required: true

  openai-api-key:
    description: >
      OpenAI API key used to generate text embeddings (text-embedding-3-small).
      Only the Embeddings API is called, so a low-usage key is sufficient.
    required: true

  github-token:
    description: >
      GitHub token for posting PR comments and commit statuses.
      The default github.token works as long as the workflow grants
      pull-requests: write and statuses: write permissions.
    required: false
    default: ''

  upstream-repo:
    description: >
      Optional upstream repository to include in memory search results,
      in "owner/repo" format (e.g. redis/docs). Useful when running in a
      fork so the action can surface context from the upstream repo's history.
    required: false
    default: ''

  query:
    description: >
      Query mode (workflow_dispatch only). Text describing planned work, for example a task
      statement. When set, the action searches memory for related items WITHOUT storing anything
      or posting to a PR, and prints the results (with full commit or squash-merge text) to the
      job log as a single REPO_MEMORY_QUERY_RESULT_JSON line. Ignored on other events.
      The text appears in the job log, which is public on public repositories.
    required: false
    default: ''

  query-files:
    description: >
      Query mode: space- or comma-separated paths of files you plan to change. They are added to
      the text that is embedded, like the changed files of a push.
    required: false
    default: ''

  query-limit:
    description: 'Query mode: maximum number of related items to return.'
    required: false
    default: '5'

  query-max-distance:
    description: 'Query mode: maximum cosine distance for a result (lower is more similar).'
    required: false
    default: '0.60'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/scripts
      run: npm ci

    - name: Collect context
      shell: bash
      env:
        QUERY_TEXT: ${{ inputs.query }}
        QUERY_FILES: ${{ inputs.query-files }}
      run: node ${{ github.action_path }}/scripts/collect_context.js

    - name: Retrieve and store memory
      shell: bash
      env:
        REDIS_URL: ${{ inputs.redis-url }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        UPSTREAM_REPO: ${{ inputs.upstream-repo }}
        QUERY_LIMIT: ${{ inputs.query-limit }}
        QUERY_MAX_DISTANCE: ${{ inputs.query-max-distance }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: node ${{ github.action_path }}/scripts/retrieve_memory.js

    - name: Post results
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node ${{ github.action_path }}/scripts/post_comment.js
